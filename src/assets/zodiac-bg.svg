<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Central intricate circle -->
  <circle cx="400" cy="400" r="380" stroke="rgba(212, 175, 55, 0.05)" stroke-width="1" fill="none" stroke-dasharray="2 4"/>
  <circle cx="400" cy="400" r="360" stroke="rgba(212, 175, 55, 0.1)" stroke-width="2" fill="none"/>
  <circle cx="400" cy="400" r="340" stroke="rgba(212, 175, 55, 0.05)" stroke-width="1" fill="none" stroke-dasharray="10 15"/>
  <circle cx="400" cy="400" r="280" stroke="rgba(0, 229, 255, 0.05)" stroke-width="1" fill="none"/>
  
  <!-- Outer geometry -->
  <g stroke="rgba(212, 175, 55, 0.08)" stroke-width="1" fill="none">
    <polygon points="400,20 780,400 400,780 20,400" />
    <polygon points="400,40 760,400 400,760 40,400" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="117" y1="117" x2="683" y2="683" />
    <line x1="117" y1="683" x2="683" y2="117" />
  </g>

  <!-- Runic symbols / Constellation dots -->
  <!-- Constellation 1 -->
  <polyline points="150,200 220,160 250,250 320,230" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1" />
  <circle cx="150" cy="200" r="2" fill="#00E5FF" opacity="0.6" />
  <circle cx="220" cy="160" r="3" fill="#00E5FF" opacity="0.8" />
  <circle cx="250" cy="250" r="1.5" fill="#00E5FF" opacity="0.5" />
  <circle cx="320" cy="230" r="2.5" fill="#00E5FF" opacity="0.7" />

  <!-- Constellation 2 -->
  <polyline points="650,550 580,600 600,680 500,650" fill="none" stroke="rgba(199, 36, 177, 0.2)" stroke-width="1" />
  <circle cx="650" cy="550" r="2" fill="#C724B1" opacity="0.6" />
  <circle cx="580" cy="600" r="3" fill="#C724B1" opacity="0.8" />
  <circle cx="600" cy="680" r="1.5" fill="#C724B1" opacity="0.5" />
  <circle cx="500" cy="650" r="2.5" fill="#C724B1" opacity="0.7" />
  
  <!-- Occasional floating rune-like characters -->
  <text x="400" y="70" fill="rgba(212, 175, 55, 0.15)" font-size="24" text-anchor="middle" font-family="serif">♈</text>
  <text x="730" y="400" fill="rgba(212, 175, 55, 0.15)" font-size="24" text-anchor="middle" font-family="serif">♋</text>
  <text x="400" y="740" fill="rgba(212, 175, 55, 0.15)" font-size="24" text-anchor="middle" font-family="serif">♎</text>
  <text x="70" y="400" fill="rgba(212, 175, 55, 0.15)" font-size="24" text-anchor="middle" font-family="serif">♑</text>
</svg>
